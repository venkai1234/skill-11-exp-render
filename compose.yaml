services:
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    environment:
      POSTGRES_DB: librarydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d librarydb"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [library-net]

  eureka-server:
    build: ./library-eureka-server
    container_name: library-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O - http://localhost:8761/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [library-net]

  auth-service:
    build: ./library-auth-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SERVER_PORT: 8082
      JWT_SECRET: "change-this-demo-secret-to-a-long-random-secret-123456789"
    depends_on:
      eureka-server:
        condition: service_started
    ports:
      - "8082:8082"
    networks: [library-net]

  book-service-1:
    build: ./library-book-service
    hostname: book-service-1
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/librarydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: "change-this-demo-secret-to-a-long-random-secret-123456789"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "8083:8083"
    networks: [library-net]

  book-service-2:
    build: ./library-book-service
    hostname: book-service-2
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/librarydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: "change-this-demo-secret-to-a-long-random-secret-123456789"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks: [library-net]

  api-gateway:
    build: ./library-api-gateway
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SERVER_PORT: 8080
    depends_on:
      eureka-server:
        condition: service_started
      auth-service:
        condition: service_started
      book-service-1:
        condition: service_started
      book-service-2:
        condition: service_started
    ports:
      - "8080:8080"
    networks: [library-net]

networks:
  library-net:
    driver: bridge

volumes:
  postgres-data:
