spring.application.name=api-gateway
server.port=${PORT:8080}
# Free Render services cannot receive private-network traffic. Route through their public HTTPS URLs.
eureka.client.enabled=false
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[1].id=book-service
spring.cloud.gateway.routes[1].uri=${BOOK_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/books/**
management.endpoints.web.exposure.include=health,info,gateway
